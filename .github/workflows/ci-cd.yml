name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

jobs:
  # =====================================================================
  # Lint & Code Quality
  # =====================================================================
  
  lint:
    name: Linting & Format Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - ruff
          - black
          - isort

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff linting
        if: matrix.check == 'ruff'
        run: python -m ruff check src/ tests/ --statistics

      - name: Run Black format check
        if: matrix.check == 'black'
        run: python -m black src/ tests/ --check --diff

      - name: Run isort import check
        if: matrix.check == 'isort'
        run: python -m isort src/ tests/ --check-only --diff

  # =====================================================================
  # Type Checking
  # =====================================================================

  typecheck:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run MyPy strict type checking
        run: python -m mypy src/ --strict --show-error-codes
        continue-on-error: true

  # =====================================================================
  # Security Scanning
  # =====================================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Bandit security scan
        run: python -m bandit -r src/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Parse and display Bandit results
        if: always()
        run: |
          python -m bandit -r src/ -f txt --severity-level medium
        continue-on-error: true

  # =====================================================================
  # Unit Tests & Coverage
  # =====================================================================

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
        exclude:
          # Only test on latest Python on Windows
          - os: windows-latest
            python-version: '3.11'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junit-xml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            junit-*.xml
            htmlcov/

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- OS: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # =====================================================================
  # Dependency Audit
  # =====================================================================

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for security vulnerabilities with pip-audit
        run: pip install pip-audit && pip-audit
        continue-on-error: true

      - name: Validate requirements.txt
        run: python -m pip check
        continue-on-error: true

  # =====================================================================
  # Docker Build
  # =====================================================================

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test]
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # =====================================================================
  # Docker Compose Validation
  # =====================================================================

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker-compose config > /dev/null 2>&1 && \
          echo "✓ docker-compose.yaml is valid" || \
          (echo "✗ docker-compose.yaml validation failed" && exit 1)

      - name: Lint docker-compose with yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint docker-compose.yaml
        continue-on-error: true

  # =====================================================================
  # Container Security Scanning
  # =====================================================================

  scan-container:
    name: Scan Container with Trivy
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: success() && github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-image-scan'

  # =====================================================================
  # Documentation Generation
  # =====================================================================

  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate API documentation
        run: |
          python -m pip install pdoc3
          pdoc3 --html --output-dir docs src/
        continue-on-error: true

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-documentation
          path: docs/

  # =====================================================================
  # Deploy to Staging
  # =====================================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker, compose-validate, scan-container]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.acosp.internal

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # TODO: Implement staging deployment
          # - Update kubernetes manifests
          # - Apply helm charts
          # - Update DNS records
          # - Run smoke tests

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # TODO: Implement smoke tests against staging

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment: ${{ job.status }}"

  # =====================================================================
  # Code Quality Summary
  # =====================================================================

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, test, audit, build-docker, compose-validate]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          echo "## 🔍 Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Checking | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compose Validation | ${{ needs.compose-validate.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Determine overall status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Quality checks failed"
            exit 1
          else
            echo "✅ All quality checks passed"
          fi
