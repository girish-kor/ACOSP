name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  # =====================================================================
  # SAST with CodeQL
  # =====================================================================

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v2

      - uses: github/codeql-action/analyze@v2

  # =====================================================================
  # Dependency Scanning
  # =====================================================================

  dependencies:
    name: Scan Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip install -r requirements.txt
          pip-audit --desc || true
        continue-on-error: true

      - name: Check for vulnerable packages
        run: |
          pip install safety
          safety check --json || true
        continue-on-error: true

  # =====================================================================
  # Secret Scanning
  # =====================================================================

  secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: pip install truffleHog

      - name: Scan for secrets
        run: |
          trufflehog git file://. --json --fail || true
        continue-on-error: true

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline || true
        continue-on-error: true

  # =====================================================================
  # SAST with Bandit
  # =====================================================================

  bandit:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Display Bandit results
        run: bandit -r src/ --severity-level medium
        continue-on-error: true

  # =====================================================================
  # Container Scanning
  # =====================================================================

  container-scan:
    name: Scan Container Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t acosp:test .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'acosp:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

  # =====================================================================
  # Infrastructure Scanning
  # =====================================================================

  infrastructure:
    name: Scan Infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Dockerfile
        run: checkov -f Dockerfile --framework dockerfile || true
        continue-on-error: true

      - name: Scan docker-compose.yaml
        run: checkov -f docker-compose.yaml --framework docker_compose || true
        continue-on-error: true

      - name: Scan Kubernetes manifests
        run: |
          if [ -d "k8s" ]; then
            checkov -d k8s --framework kubernetes || true
          fi
        continue-on-error: true

  # =====================================================================
  # Security Report
  # =====================================================================

  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [codeql, dependencies, secrets, bandit, infrastructure]
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        if: always()

      - name: Generate security report
        run: |
          echo "## 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify if vulnerabilities found
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: '⚠️ Security vulnerabilities detected in ${{ github.repository }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
