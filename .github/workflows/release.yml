name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =====================================================================
  # Create Release
  # =====================================================================

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      release_version: ${{ steps.extract_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # TODO: Generate changelog from commits since last tag
          cat > CHANGELOG_ENTRY.md << 'EOF'
          # Release ${{ steps.extract_version.outputs.version }}

          ## Changes
          - [List of changes]
          - [Generated from commits]

          ## Bug Fixes
          - [Fixed issues]

          ## Breaking Changes
          - [If any]

          ## Contributors
          - Thanks to all contributors

          EOF
          cat CHANGELOG_ENTRY.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release v${{ steps.extract_version.outputs.version }}
          body_path: CHANGELOG_ENTRY.md
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # Build & Push Release Images
  # =====================================================================

  build-release:
    name: Build Release Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.create-release.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=v${{ needs.create-release.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================
  # Publish to PyPI
  # =====================================================================

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install build twine

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = .*/version = "${{ needs.create-release.outputs.release_version }}"/' pyproject.toml
          cat pyproject.toml | grep version | head -1

      - name: Build distribution
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/* --skip-existing
        continue-on-error: true

  # =====================================================================
  # Update Release Notes
  # =====================================================================

  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: create-release
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Update version in documentation
        run: |
          # TODO: Update documentation with new version
          # - Update installation instructions
          # - Update version badges
          # - Update changelog

      - name: Generate API docs
        run: |
          python -m pip install pdoc3
          pdoc3 --html --output-dir docs src/
        continue-on-error: true

      - name: Create pull request with updated docs
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'docs: update for release v${{ needs.create-release.outputs.release_version }}'
          title: 'docs: update for release v${{ needs.create-release.outputs.release_version }}'
          body: |
            Update documentation for release v${{ needs.create-release.outputs.release_version }}
            
            - Update version references
            - Update installation instructions
            - Add release notes
          branch: docs/release-v${{ needs.create-release.outputs.release_version }}
          base: main
        continue-on-error: true

  # =====================================================================
  # Announce Release
  # =====================================================================

  announce:
    name: Announce Release
    runs-on: ubuntu-latest
    needs: [create-release, build-release, publish-pypi]
    if: always()

    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🎉 Release v${{ needs.create-release.outputs.release_version }} is now available!
            
            Docker: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.create-release.outputs.release_version }}
            PyPI: https://pypi.org/project/acosp/${{ needs.create-release.outputs.release_version }}/
            Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.release_version }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Create deployment issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy release v${{ needs.create-release.outputs.release_version }}`,
              body: `Release v${{ needs.create-release.outputs.release_version }} is ready for deployment to production.\n\nImage: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.create-release.outputs.release_version }}`,
              labels: ['deployment', 'release']
            })
        continue-on-error: true

      - name: Release summary
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ needs.create-release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.create-release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release**: [${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.release_version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.release_version }})" >> $GITHUB_STEP_SUMMARY
